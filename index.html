<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>💃 外婆健身操</title>

<!-- Google Fonts: Fraunces italic + Caveat + Noto Sans/Serif SC -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:ital,wght@0,700;0,900;1,700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">

<style>
/* ================================================================
   DESIGN TOKENS — Nign Design DNA (brand-dna.md)
   ================================================================ */
:root {
  /* Brand three-color palette */
  --blue:       #2B7FD8;
  --blue-light: #5A9EE8;
  --blue-dark:  #1A5FAD;
  --yellow:     #F4D758;
  --yellow-dark:#C4A820;
  --red:        #E84A5F;
  --red-dark:   #C0394A;

  /* Surfaces */
  --cream:      #fefcf6;
  --cream-deep: #faf6eb;
  --card-bg:    #ffffff;
  --dark-bg:    #151821;
  --dark-card:  #1e2030;

  /* Ink system */
  --ink:        #1A1A2E;
  --ink-light:  #4A4A5A;
  --ink-faint:  #8A8A9A;
  --border:     rgba(26,26,26,0.08);

  /* Typography — brand-dna.md font pool */
  --font-serif:      'Noto Serif SC', 'Huiwen Mincho', 'PingFang SC', serif;
  --font-sans:       'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  --font-display:    'Noto Serif SC', 'Huiwen Mincho', serif;
  --font-english:    'Fraunces', 'Noto Serif SC', serif;
  --font-handwrite:  'Caveat', cursive;
  --font-mono:       'Fira Code', 'Cascadia Code', monospace;

  /* Type scale — fluid, extreme contrast */
  --text-hero:  clamp(2.8rem, 7vw, 5.5rem);
  --text-3xl:   clamp(2.4rem, 6vw, 4rem);
  --text-2xl:   clamp(1.8rem, 4vw, 2.6rem);
  --text-xl:    clamp(1.4rem, 3vw, 1.8rem);
  --text-lg:    clamp(1.1rem, 2.5vw, 1.3rem);
  --text-md:    clamp(1rem, 2vw, 1.1rem);
  --text-sm:    clamp(0.85rem, 1.5vw, 0.95rem);
  --text-xs:    clamp(0.72rem, 1.2vw, 0.82rem);
  --text-tiny:  0.65rem;

  /* Spacing — brand-dna fluid spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: clamp(40px, 6vw, 60px);
  --section-gap: clamp(60px, 10vh, 120px);

  /* Radii */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 50px;

  /* Shadows — brand card style */
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.08);
  --shadow-blue: 0 8px 24px rgba(43,127,216,0.3);

  /* Motion tokens — expo ease-out */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --duration-fast: 150ms;
  --duration-md:   300ms;
  --duration-slow: 500ms;
  --duration-glacial: 800ms;

  /* Layout */
  --app-max-w: 720px;
}

/* Brand-specific global tokens */
::selection {
  background: var(--yellow);
  color: var(--ink);
}

/* ================================================================
   RESET & BASE
   ================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  height: 100%;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  background: var(--cream);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar — brand blue */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(43,127,216,0.25);
  border-radius: 3px;
}

/* Focus — brand yellow dashed outline */
:focus-visible {
  outline: 3px dashed var(--yellow);
  outline-offset: 3px;
}

/* ================================================================
   SVG FILTERS — rough paper edge
   ================================================================ */
.rough-edge { filter: url(#rough-paper); }

/* ================================================================
   UTILITY CLASSES
   ================================================================ */
.font-serif  { font-family: var(--font-serif); }
.font-sans   { font-family: var(--font-sans); }
.font-display { font-family: var(--font-display); }

/* ================================================================
   APP SHELL
   ================================================================ */
.app {
  position: relative; z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: var(--app-max-w);
  margin: 0 auto;
  overflow: hidden;
}

/* ================================================================
   VIEW TRANSITIONS
   ================================================================ */
.view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-md) var(--ease-out);
  will-change: opacity;
}
.view.active {
  opacity: 1;
  pointer-events: auto;
}

/* ================================================================
   TOAST — brand yellow notification
   ================================================================ */
.toast {
  position: fixed; top: 20px; left: 50%; z-index: 300;
  transform: translateX(-50%) translateY(-140px);
  background: var(--ink);
  color: #fff;
  padding: 14px 28px;
  border-radius: var(--radius-pill);
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 500;
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  border: 2px solid var(--yellow);
  transition: transform var(--duration-md) var(--ease-spring);
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ================================================================
   LOGIN VIEW
   ================================================================ */
.login-view {
  align-items: center;
  justify-content: center;
  padding: var(--space-xl) var(--space-lg);
  background: var(--cream);
  gap: var(--space-lg);
  text-align: center;
}

/* Hand-drawn decorative leaf SVG */
.login-leaf-deco {
  width: 140px; height: 45px;
  opacity: 0.5;
  margin-bottom: -8px;
}

.login-view .login-icon {
  font-size: 80px;
  animation: gentle-float 3s var(--ease-in-out) infinite;
  filter: drop-shadow(0 3px 0 rgba(0,0,0,0.06));
}
@keyframes gentle-float {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
}

.login-view h1 {
  font-family: var(--font-serif);
  font-size: var(--text-3xl);
  font-weight: 900;
  color: var(--blue);
  letter-spacing: 2px;
  line-height: 1.2;
}
.login-view .login-subtitle {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  color: var(--ink-faint);
  margin-top: var(--space-xs);
}

/* Login card — white editorial card */
.login-card {
  background: var(--card-bg);
  border-radius: var(--radius-xl);
  padding: var(--space-xl) var(--space-lg);
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
  position: relative;
}
.login-card::before {
  content: '';
  position: absolute; top: -2px; left: 28px; right: 28px;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), var(--yellow));
  border-radius: 2px;
}

.login-card label {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--ink-light);
  display: block;
  margin-bottom: var(--space-xs);
}

/* Form input — brand style */
.form-input {
  width: 100%;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  background: var(--cream);
  color: var(--ink);
  transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
  -webkit-appearance: none;
}
.form-input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(43,127,216,0.1);
}

.login-error {
  font-family: var(--font-sans);
  color: var(--red);
  font-size: var(--text-sm);
  text-align: center;
  min-height: 22px;
}

/* Buttons — brand CTA style */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 14px 28px;
  border-radius: var(--radius-md);
  border: none;
  font-family: var(--font-sans);
  font-size: var(--text-md);
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-spring),
              box-shadow var(--duration-fast) var(--ease-out);
  background: var(--card-bg);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  position: relative;
}
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.5; pointer-events: none; }

/* CTA button — blue (components.md #20) */
.btn-primary {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 4px 16px rgba(43,127,216,0.25);
  border: none;
  font-size: var(--text-md);
  padding: 18px 32px;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-blue);
}
.btn-primary:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(43,127,216,0.2);
}

/* Secondary button */
.btn-secondary {
  background: var(--cream-deep);
  color: var(--ink);
  border: 1.5px solid var(--border);
}

/* Danger button — brand red */
.btn-danger {
  background: var(--red);
  color: #fff;
  border: none;
  box-shadow: 0 2px 8px rgba(232,74,95,0.2);
}
.btn-danger:hover {
  box-shadow: 0 4px 16px rgba(232,74,95,0.35);
  transform: translateY(-1px);
}

.btn-block { width: 100%; justify-content: center; }
.btn-sm { padding: 8px 18px; font-size: var(--text-sm); }

/* Login footer links */
.login-footer { text-align: center; }
.login-footer a {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  color: var(--blue);
  text-decoration: none;
  cursor: pointer;
  transition: color var(--duration-fast);
  border-bottom: 1.5px dashed var(--blue);
  opacity: 0.7;
}
.login-footer a:hover { opacity: 1; }
.login-footer .logout-link {
  color: var(--ink-faint);
  font-size: var(--text-sm);
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
}

/* ================================================================
   ELDERLY MODE — warm, large, ultra-clear
   ================================================================ */
.elderly-header {
  padding: var(--space-xl) var(--space-lg) var(--space-sm);
  text-align: center;
  flex-shrink: 0;
  position: relative;
}
.elderly-header h1 {
  font-family: var(--font-serif);
  font-size: var(--text-3xl);
  font-weight: 900;
  color: var(--blue);
  letter-spacing: 2px;
  cursor: default;
  display: inline-block;
  position: relative;
  transition: transform var(--duration-fast) var(--ease-spring);
}
.elderly-header h1:active { transform: scale(0.97); }
.elderly-header h1::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 10%;
  right: 10%;
  height: 3px;
  background: var(--yellow);
  border-radius: 2px;
  opacity: 0.5;
}

/* Decorative leaf doodles around title */
.elderly-header .deco-left,
.elderly-header .deco-right {
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 28px; opacity: 0.25; pointer-events: none;
}
.elderly-header .deco-left  { left: 8px; }
.elderly-header .deco-right { right: 8px; }

.elderly-subtitle {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  color: var(--ink-faint);
  margin-top: var(--space-xs);
}

/* Video list scroll */
.video-list-scroll {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-sm) var(--space-lg) 120px;
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  scroll-behavior: smooth;
}

/* Empty state */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-2xl) var(--space-lg);
  gap: var(--space-md);
}
.empty-state .empty-icon {
  font-size: 72px;
  opacity: 0.4;
  animation: gentle-float 4s var(--ease-in-out) infinite;
}
.empty-state p {
  font-family: var(--font-sans);
  font-size: var(--text-lg);
  color: var(--ink-faint);
  line-height: 1.8;
  max-width: 280px;
}

/* Video card — icon card variant (#1D from components.md) */
.video-card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: var(--space-md);
  min-height: 90px;
  overflow: hidden;
  transition: transform var(--duration-fast) var(--ease-spring),
              box-shadow var(--duration-fast) var(--ease-out);
}
.video-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.video-card:active {
  transform: scale(0.97);
  box-shadow: var(--shadow-sm);
}

/* Play icon area — blue gradient bg */
.video-card .card-play-icon {
  flex: 0 0 60px;
  width: 60px; height: 60px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  color: #fff;
  box-shadow: 0 3px 12px rgba(43,127,216,0.2);
  margin-left: var(--space-md);
}

.video-card .card-info { flex: 1; min-width: 0; padding: var(--space-md) 0; }
.video-card .card-title {
  font-family: var(--font-serif);
  font-size: var(--text-xl);
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.3;
}
.video-card .card-type-badge {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  color: var(--ink-faint);
  margin-top: 4px;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--cream-deep);
  border: 1px solid var(--border);
}
.video-card .card-arrow {
  font-size: 24px;
  color: var(--blue);
  flex-shrink: 0;
  margin-right: var(--space-md);
  transition: transform var(--duration-fast) var(--ease-spring);
}
.video-card:hover .card-arrow { transform: translateX(4px); }

/* Sync indicator — brand yellow tag */
.sync-indicator {
  position: fixed;
  top: 12px;
  right: 16px;
  z-index: 20;
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  padding: 6px 14px;
  background: var(--card-bg);
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: opacity var(--duration-md), transform var(--duration-md) var(--ease-spring);
}
.sync-indicator.syncing { color: var(--blue); border-color: var(--blue); }
.sync-indicator.synced {
  color: #4a9e4a; opacity: 0; transform: translateY(-8px);
  transition: opacity 0.5s 1.5s, transform 0.5s 1.5s var(--ease-out);
}

/* ================================================================
   PLAYER — fullscreen overlay, dark brand background
   ================================================================ */
.player-container {
  position: absolute; inset: 0; background: var(--dark-bg); z-index: 30;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity var(--duration-md) var(--ease-out);
}
.player-container.active { opacity: 1; pointer-events: auto; }

.player-top {
  display: flex; align-items: center; padding: var(--space-md) var(--space-lg);
  gap: var(--space-md); flex-shrink: 0;
}
.player-back-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #e2e8f0;
  font-family: var(--font-sans);
  font-size: var(--text-lg);
  font-weight: 500;
  padding: 10px 24px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: background var(--duration-fast);
}
.player-back-btn:active { background: rgba(255,255,255,0.16); }

.player-video-wrapper {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #000; position: relative;
}
.player-video-wrapper video,
.player-video-wrapper iframe {
  width: 100%; height: 100%; border: none; object-fit: contain;
}

.player-video-wrapper .unsupported-hint {
  color: #e2e8f0; text-align: center; padding: var(--space-xl);
  font-family: var(--font-sans);
}
.player-video-wrapper .unsupported-hint a {
  color: var(--yellow);
  font-family: var(--font-sans);
  font-size: var(--text-xl);
  font-weight: 600;
  display: inline-block; margin-top: var(--space-md);
  padding: var(--space-md) var(--space-xl);
  background: var(--blue);
  border: none;
  border-radius: var(--radius-pill);
  text-decoration: none;
  transition: background var(--duration-fast), box-shadow var(--duration-fast);
}
.player-video-wrapper .unsupported-hint a:hover {
  background: var(--blue-light);
  box-shadow: var(--shadow-blue);
}

.player-controls {
  display: flex; justify-content: center; padding: var(--space-lg);
  gap: var(--space-lg); flex-shrink: 0;
}
.player-ctrl-btn {
  width: 72px; height: 72px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.15);
  font-size: 28px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06);
  transition: transform var(--duration-fast) var(--ease-spring),
              background var(--duration-fast);
  color: #e2e8f0;
}
.player-ctrl-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.14); }
.player-ctrl-btn.play-pause {
  width: 84px; height: 84px; font-size: 32px;
  background: var(--blue); border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 20px rgba(43,127,216,0.4);
}

/* ================================================================
   ADMIN MODE — editorial management UI
   ================================================================ */
.admin-container {
  padding: var(--space-md) var(--space-lg) 100px;
  flex: 1; overflow-y: auto;
}
.admin-container h2 {
  font-family: var(--font-serif);
  font-size: var(--text-2xl);
  font-weight: 900;
  color: var(--blue);
  letter-spacing: 2px;
  margin-bottom: var(--space-lg);
  display: flex; align-items: center; gap: var(--space-sm);
}

/* Admin section — handwrite card (#3B) */
.admin-section {
  margin-bottom: var(--space-xl);
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  position: relative;
}
.admin-section h3 {
  font-family: var(--font-serif);
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--ink);
  margin-bottom: var(--space-md);
  padding-bottom: var(--space-sm);
  border-bottom: 2px solid var(--yellow);
  display: inline-block;
}

/* Form group */
.form-group { margin-bottom: var(--space-md); }
.form-group label {
  display: block;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--ink-light);
  margin-bottom: var(--space-xs);
}

/* Admin video list items */
.admin-video-item {
  display: flex; align-items: center; gap: var(--space-md);
  padding: var(--space-md);
  background: var(--cream);
  border-radius: var(--radius-sm);
  margin-bottom: var(--space-sm);
  border: 1px solid var(--border);
  transition: box-shadow var(--duration-fast), border-color var(--duration-fast);
  cursor: grab;
}
.admin-video-item:hover {
  border-color: var(--blue);
  box-shadow: var(--shadow-sm);
}
.admin-video-item:active { cursor: grabbing; }
.admin-video-item .drag-handle {
  color: var(--ink-faint); font-size: 18px; padding: 4px; cursor: grab;
  font-family: var(--font-sans);
}
.admin-video-item .item-icon {
  font-size: 24px; flex-shrink: 0;
}
.admin-video-item .item-info { flex: 1; min-width: 0; }
.admin-video-item .item-title {
  font-family: var(--font-serif);
  font-size: var(--text-md);
  font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.admin-video-item .item-meta {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  color: var(--ink-faint);
  margin-top: 2px;
}
.admin-video-item .item-delete {
  background: none; border: none; font-size: 20px; cursor: pointer;

  transition: background var(--duration-fast), color var(--duration-fast);
  color: var(--ink-faint);
}

/* Admin user bar */
.admin-user-bar {
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  color: var(--ink-light);
  padding: var(--space-sm) 0;
  margin-bottom: var(--space-md);
  border-bottom: 1px solid var(--border);
}
.admin-user-bar .logout-btn {
  background: none;
  border: 1px solid var(--border);
  font-family: var(--font-sans);
  font-size: var(--text-xs);

  padding: 6px 16px;
  border-radius: var(--radius-pill);

  transition: all var(--duration-fast);
}

/* Admin bottom bar */
.admin-bottom {
  display: flex; gap: var(--space-md);
  padding: var(--space-md) var(--space-lg);
  background: var(--cream);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

/* Progress bar */

  margin-top: var(--space-md);
  background: rgba(0,0,0,0.04);
  border-radius: 8px;
  height: 6px; overflow: hidden;
  border: 1px solid var(--border);
}
.progress-bar-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 8px;
  width: 0%;
  transition: width 0.4s var(--ease-out);
}

/* Empty admin hint */

  text-align: center;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  color: var(--ink-faint);
  padding: var(--space-xl);
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(function() {
  'use strict';

  // ================================================================
  //  SUPABASE INIT
  // ================================================================
  const SUPABASE_URL = 'https://mbkdigtofgmdkepwsrve.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ia2RpZ3RvZmdtZGtlcHdzcnZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTMyMjcsImV4cCI6MjA5NzI2OTIyN30.BGlRJJbL6BvcZC1XrZTeN_3AOiiQgiAKniXfREunzeQ';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ================================================================
  //  INDEXEDDB ADAPTER
  // ================================================================
  const IDB_NAME = 'GrandmaFitnessDB';
  const IDB_VERSION = 1;
  const IDB_STORE = 'videos';

  function openIDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbPut(id, blob) {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({ id, blob });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function idbGet(id) {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(id);
      req.onsuccess = () => resolve(req.result ? req.result.blob : null);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbDelete(id) {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ================================================================
  //  SUPABASE VIDEO OPERATIONS
  // ================================================================
  async function loadVideosFromSupabase() {
    const { data, error } = await supabase
      .from('videos')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('sort_order', { ascending: true });

    if (error) throw error;
    return (data || []).map(r => ({
      id: r.id,
      title: r.title,
      type: r.type,
      source: r.source || null,
      localId: r.local_id || null,
      fileName: r.file_name || null,
      fileSize: r.file_size || null,
      order: r.sort_order || 0
    }));
  }

  async function saveVideoToSupabase(video) {
    const { error } = await supabase.from('videos').upsert({
      id: video.id,
      title: video.title,
      type: video.type,
      source: video.source || null,
      local_id: video.localId || null,
      file_name: video.fileName || null,
      file_size: video.fileSize || null,
      sort_order: video.order,
      user_id: currentUser.id,
      updated_at: new Date().toISOString()
    });
    if (error) throw error;
  }

  async function deleteVideoFromSupabase(videoId) {
    const { error } = await supabase.from('videos').delete().eq('id', videoId).eq('user_id', currentUser.id);
    if (error) throw error;
  }

  async function saveAllVideosToSupabase(videos) {
    const rows = videos.map(v => ({
      id: v.id,
      title: v.title,
      type: v.type,
      source: v.source || null,
      local_id: v.localId || null,
      file_name: v.fileName || null,
      file_size: v.fileSize || null,
      sort_order: v.order,
      user_id: currentUser.id,
      updated_at: new Date().toISOString()
    }));
    const { error } = await supabase.from('videos').upsert(rows);
    if (error) throw error;
  }

  // ================================================================
  //  REALTIME SUBSCRIPTION
  // ================================================================
  let realtimeChannel = null;

  function subscribeToChanges() {
    if (realtimeChannel) { supabase.removeChannel(realtimeChannel); }
    realtimeChannel = supabase
      .channel('videos-changes')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'videos', filter: `user_id=eq.${currentUser.id}` },
        async () => {
          try {
            const videos = await loadVideosFromSupabase();
            if (currentMode === 'elderly') { renderElderlyList(videos); }
            else if (currentMode === 'admin') { renderAdminList(videos); }
            showSyncStatus('已同步');
          } catch(e) { showSyncStatus('同步失败'); }
        }
      )
      .subscribe();
  }

  function unsubscribeFromChanges() {
    if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
  }

  function showSyncStatus(status) {
    const el = $('syncIndicator');
    if (!el) return;
    el.style.display = 'block';
    if (status === 'syncing') {
      el.className = 'sync-indicator syncing';
      el.textContent = '☁️ 同步中...';
    } else {
      el.className = 'sync-indicator synced';
      el.textContent = '✅ 已同步';
      setTimeout(() => { el.style.display = 'none'; }, 3500);
    }
  }

  // ================================================================
  //  APP STATE
  // ================================================================
  let meta = { videos: [] };
  let currentMode = 'login';
  let currentUser = null;
  let titleClickCount = 0;
  let titleClickTimer = null;
  const TITLE_CLICK_THRESHOLD = 5;
  const TITLE_CLICK_WINDOW = 2500;

  let currentPlayingVideo = null;
  let playerVideoEl = null;
  let isPlaying = false;

  // ================================================================
  //  DOM HELPERS
  // ================================================================
  const $ = (id) => document.getElementById(id);

  // ================================================================
  //  TOAST — spring-animated notification
  // ================================================================
  let toastTimer = null;
  function showToast(msg, duration = 2200) {
    const toast = $('toast');
    if (toastTimer) clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
      toastTimer = null;
    }, duration);
  }

  // ================================================================
  //  AUTH
  // ================================================================
  let signupMode = false;

  async function doLogin() {
    const emailEl = $('loginEmail');
    const passEl = $('loginPassword');
    const errEl = $('loginError');
    const btnEl = $('loginBtn');

    const email = emailEl.value.trim();
    const password = passEl.value.trim();

    if (!email) { errEl.textContent = '请输入邮箱地址'; return; }
    if (!password) { errEl.textContent = '请输入密码'; return; }
    if (password.length < 6) { errEl.textContent = '密码至少6位'; return; }

    btnEl.disabled = true;
    errEl.textContent = '';

    try {
      if (signupMode) {
        const { data, error } = await supabase.auth.signUp({ email, password, options: { emailRedirectTo: window.location.href } });
        if (error) throw error;
        if (data.user) {
          showToast('✅ 账号创建成功！');
          signupMode = false;
          $('showSignupLink').textContent = '首次使用？创建账号';
        }
      }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      currentUser = data.user;
      onLoginSuccess();
    } catch(err) {
      errEl.textContent = getAuthErrorMessage(err);
    } finally {
      btnEl.disabled = false;
    }
  }

  function getAuthErrorMessage(err) {
    const msg = err.message || String(err);
    if (msg.includes('Invalid login credentials') || msg.includes('Invalid Login')) return '邮箱或密码错误，请重试';
    if (msg.includes('Email not confirmed')) return '邮箱尚未验证，请先确认邮箱';
    if (msg.includes('User already registered') || msg.includes('already been registered')) return '该邮箱已注册，请直接登录';
    if (msg.includes('password') && msg.includes('weak')) return '密码太弱，请使用6位以上密码';
    if (msg.includes('valid email')) return '请输入有效的邮箱地址';
    if (msg.includes('rate') || msg.includes('limit')) return '请求太频繁，请稍后再试';
    if (msg.includes('network') || msg.includes('fetch')) return '网络连接失败，请检查网络';
    return '登录失败：' + msg;
  }

  async function onLoginSuccess() {
    $('loginError').textContent = '';
    $('loginPassword').value = '';
    $('loginBtn').disabled = false;
    try { meta.videos = await loadVideosFromSupabase(); }
    catch(e) { console.warn('Failed to load videos:', e); meta.videos = []; }
    subscribeToChanges();
    switchToElderly();
  }

  async function doLogout() {
    if (!confirm('确定要退出登录吗？\n退出后无法自动同步视频列表。')) return;
    unsubscribeFromChanges();
    await supabase.auth.signOut();
    currentUser = null;
    meta.videos = [];
    switchToLogin();
  }

  // ================================================================
  //  VIEW SWITCHING
  // ================================================================
  function switchToLogin() {
    currentMode = 'login';
    $('loginView').classList.add('active');
    $('elderlyView').classList.remove('active');
    $('adminView').classList.remove('active');
    closePlayer();
    if (currentUser) $('loginEmail').value = currentUser.email;
  }

  function switchToElderly() {
    currentMode = 'elderly';
    $('loginView').classList.remove('active');
    $('elderlyView').classList.add('active');
    $('adminView').classList.remove('active');
    closePlayer();
    renderElderlyList(meta.videos);
  }

  function switchToAdmin() {
    if (!currentUser) { showToast('请先登录'); switchToLogin(); return; }
    currentMode = 'admin';
    $('elderlyView').classList.remove('active');
    $('adminView').classList.add('active');
    closePlayer();
    $('adminUserEmail').textContent = '👤 ' + currentUser.email;
    renderAdminList(meta.videos);
  }

  // ================================================================
  //  ELDERLY MODE: RENDER
  // ================================================================
  function renderElderlyList(videos) {
    const sorted = (videos || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    const hintEl = $('videoCountHint');
    const listEl = $('videoList');

    if (sorted.length === 0) {
      if (hintEl) hintEl.textContent = '';
      listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🌿</div><p>还没有视频哦～<br>让家人帮忙添加吧</p></div>';
      return;
    }

    if (hintEl) hintEl.textContent = '共 ' + sorted.length + ' 个视频';
    listEl.innerHTML = sorted.map((v) => `
      <div class="video-card" data-video-id="${v.id}">
        <div class="card-play-icon">▶</div>
        <div class="card-info">
          <div class="card-title">${escapeHtml(v.title)}</div>
          <span class="card-type-badge">${getVideoTypeLabel(v)}</span>
        </div>
        <div class="card-arrow">❯</div>
      </div>
    `).join('');

    listEl.querySelectorAll('.video-card').forEach(card => {
      card.addEventListener('click', () => {
        const vid = card.dataset.videoId;
        const video = meta.videos.find(v => v.id === vid);
        if (video) openPlayer(video);
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ================================================================
  //  VIDEO PLAYER
  // ================================================================
  async function openPlayer(video) {
    currentPlayingVideo = video;
    const wrapper = $('playerVideoWrapper');
    wrapper.innerHTML = '';
    playerVideoEl = null;
    isPlaying = false;
    $('playerPlayPauseBtn').textContent = '▶️';
    $('playerContainer').classList.add('active');

    if (video.type === 'local') {
      try {
        showToast('正在加载视频...', 1500);
        const blob = await idbGet(video.localId);
        if (!blob) {
          wrapper.innerHTML = '<div class="unsupported-hint"><p>视频文件找不到了 😢</p><p style="font-size:var(--text-sm);color:rgba(255,255,255,0.5);margin-top:8px">请让家人重新添加</p></div>';
          return;
        }
        const url = URL.createObjectURL(blob);
        createVideoElement(url);
      } catch(e) { wrapper.innerHTML = '<div class="unsupported-hint"><p>视频加载失败 😢</p></div>'; }
    } else if (video.type === 'link') {
      const src = video.source;
      if (isBilibiliUrl(src)) {
        const bvid = extractBvid(src);
        if (bvid) {
          wrapper.innerHTML = '<iframe src="https://player.bilibili.com/player.html?bvid=' + bvid + '&high_quality=1&autoplay=1" allowfullscreen allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>';
          isPlaying = true;
          $('playerPlayPauseBtn').textContent = '⏸️';
        } else { showExternalLinkView(src); }
      } else if (isYouTubeUrl(src)) {
        const videoId = extractYouTubeId(src);
        if (videoId) {
          wrapper.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&playsinline=1" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>';
          isPlaying = true;
          $('playerPlayPauseBtn').textContent = '⏸️';
        } else { showExternalLinkView(src); }
      } else if (isDirectVideoUrl(src)) {
        createVideoElement(src);
      } else { showExternalLinkView(src); }
    }
  }

  function createVideoElement(src) {
    const wrapper = $('playerVideoWrapper');
    wrapper.innerHTML = '';
    const video = document.createElement('video');
    video.src = src;
    video.controls = false;
    video.playsInline = true;
    video.style.cssText = 'width:100%;height:100%;object-fit:contain;';
    video.setAttribute('playsinline', '');
    video.play().then(() => {
      isPlaying = true;
      $('playerPlayPauseBtn').textContent = '⏸️';
    }).catch(() => {
      isPlaying = false;
      $('playerPlayPauseBtn').textContent = '▶️';
    });
    video.addEventListener('ended', () => { isPlaying = false; $('playerPlayPauseBtn').textContent = '🔄'; });
    video.addEventListener('play', () => { isPlaying = true; $('playerPlayPauseBtn').textContent = '⏸️'; });
    video.addEventListener('pause', () => { isPlaying = false; $('playerPlayPauseBtn').textContent = '▶️'; });
    wrapper.appendChild(video);
    playerVideoEl = video;
  }

  function showExternalLinkView(url) {
    const wrapper = $('playerVideoWrapper');
    const isWx = isWeChatVideoUrl(url);
    const pname = getPlatformName(url);

    if (isWx) {
      wrapper.innerHTML = '<div class="unsupported-hint"><div style="font-size:56px;margin-bottom:16px">💬</div><p style="font-family:var(--font-display);font-size:var(--text-xl);color:#fff;letter-spacing:2px;margin-bottom:8px">微信视频号</p><p style="color:rgba(255,255,255,0.5);font-size:var(--text-sm);margin-bottom:24px">这个视频只能在微信里看</p><p style="color:rgba(255,255,255,0.7);font-size:var(--text-md);margin-bottom:28px;line-height:1.6">让家人帮忙<br>把视频下载后上传到这里</p></div>';
    } else {
      wrapper.innerHTML = '<div class="unsupported-hint"><div style="font-size:56px;margin-bottom:16px">📺</div><p style="font-family:var(--font-display);font-size:var(--text-xl);color:#fff;letter-spacing:2px;margin-bottom:8px">' + escapeHtml(pname) + ' 视频</p><p style="color:rgba(255,255,255,0.5);font-size:var(--text-sm);margin-bottom:20px">需在 ' + escapeHtml(pname) + ' App 中观看</p><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener" style="font-family:var(--font-sans);font-size:var(--text-lg);letter-spacing:1px;padding:18px 40px;text-decoration:none;display:inline-block;background:var(--blue);color:#fff;border-radius:var(--radius-pill);border:none;">👆 点这里打开视频</a></div>';
    }
  }

  function closePlayer() {
    if (playerVideoEl) {
      playerVideoEl.pause();
      if (playerVideoEl.src.startsWith('blob:')) URL.revokeObjectURL(playerVideoEl.src);
      playerVideoEl = null;
    }
    $('playerVideoWrapper').innerHTML = '';
    $('playerContainer').classList.remove('active');
    currentPlayingVideo = null;
    isPlaying = false;
  }

  function togglePlayPause() {
    if (!currentPlayingVideo) return;
    const iframe = $('playerVideoWrapper').querySelector('iframe');
    if (iframe) { showToast('在线视频无法在此暂停，请点击视频内部控制'); return; }
    const extLink = $('playerVideoWrapper').querySelector('.unsupported-hint a');
    if (extLink && currentPlayingVideo.type === 'link') { extLink.click(); return; }
    if (playerVideoEl) {
      if (isPlaying) playerVideoEl.pause();
      else playerVideoEl.play().catch(() => {});
    }
  }

  // ================================================================
  //  URL DETECTION HELPERS
  // ================================================================
  function isBilibiliUrl(url) { return /bilibili\.com/i.test(url); }
  function extractBvid(url) { const m = url.match(/BV[a-zA-Z0-9]+/); return m ? m[0] : null; }
  function isYouTubeUrl(url) { return /(youtube\.com|youtu\.be)/i.test(url); }
  function extractYouTubeId(url) {
    const patterns = [/[?&]v=([a-zA-Z0-9_-]{11})/, /youtu\.be\/([a-zA-Z0-9_-]{11})/, /\/embed\/([a-zA-Z0-9_-]{11})/, /\/v\/([a-zA-Z0-9_-]{11})/];
    for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
    return null;
  }
  function isDirectVideoUrl(url) {
    try { const p = new URL(url).pathname.toLowerCase(); return /\.(mp4|m3u8|webm|ogg|mov|mkv|avi|ts|flv)(\?|#|$)/.test(p) || /\.(mp4|m3u8|webm|ogg|mov|mkv|avi|ts|flv)$/.test(p); }
    catch(e) { return false; }
  }
  function isWeChatVideoUrl(url) { return /channels\.weixin\.qq\.com|finder\.video\.qq\.com|weixin\.qq\.com/i.test(url); }
  function getPlatformName(url) {
    if (isWeChatVideoUrl(url)) return '微信视频号';
    if (/douyin\.com/i.test(url)) return '抖音';
    if (/kuaishou\.com/i.test(url)) return '快手';
    if (/xiaohongshu\.com|xhslink\.com/i.test(url)) return '小红书';
    if (/weibo\.com|weibo\.cn/i.test(url)) return '微博';
    if (/zhihu\.com/i.test(url)) return '知乎';
    if (/ixigua\.com/i.test(url)) return '西瓜视频';
    if (/haokan\.baidu\.com/i.test(url)) return '好看视频';
    if (/v\.qq\.com/i.test(url)) return '腾讯视频';
    if (/iqiyi\.com/i.test(url)) return '爱奇艺';
    if (/youku\.com/i.test(url)) return '优酷';
    if (/mgtv\.com/i.test(url)) return '芒果TV';
    return '该平台';
  }
  function getVideoTypeLabel(v) {
    if (v.type === 'local') return '本地视频';
    if (isBilibiliUrl(v.source)) return 'B站视频';
    if (isYouTubeUrl(v.source)) return 'YouTube';
    if (isDirectVideoUrl(v.source)) return '在线视频';
    return getPlatformName(v.source) + '视频';
  }

  // ================================================================
  //  ADMIN MODE: RENDER
  // ================================================================
  function renderAdminList(videos) {
    const sorted = (videos || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    const listEl = $('adminVideoList');
    const hintEl = $('emptyAdminHint');

    if (sorted.length === 0) {
      if (hintEl) hintEl.style.display = 'block';
      listEl.innerHTML = '';
    } else {
      if (hintEl) hintEl.style.display = 'none';
      listEl.innerHTML = sorted.map((v) => `
        <div class="admin-video-item" data-video-id="${v.id}" draggable="true">
          <span class="drag-handle">☰</span>
          <span class="item-icon">${v.type === 'local' ? '📁' : '🔗'}</span>
          <div class="item-info">
            <div class="item-title">${escapeHtml(v.title)}</div>
            <div class="item-meta">${getAdminItemMeta(v)}</div>
          </div>
          <button class="item-delete" data-delete-id="${v.id}" title="删除">🗑️</button>
        </div>
      `).join('');

      listEl.querySelectorAll('.item-delete').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); deleteVideo(btn.dataset.deleteId); });
      });
      bindDragEvents();
      checkMissingLocalBlobs();
    }
  }

  function getAdminItemMeta(v) {
    if (v.type === 'local') { return (v.fileName ? '本地视频 · ' + v.fileName : '本地视频'); }
    if (v.source) return '在线链接 · ' + getVideoTypeLabel(v);
    return '在线链接';
  }

  async function checkMissingLocalBlobs() {
    const localVideos = meta.videos.filter(v => v.type === 'local' && v.localId);
    for (const v of localVideos) {
      try {
        const blob = await idbGet(v.localId);
        if (!blob) {
          const item = $('adminVideoList').querySelector('[data-video-id="' + v.id + '"]');
          if (item) {
            const meta = item.querySelector('.item-meta');
            if (meta) meta.innerHTML += ' <span style="color:#e09b3c">⚠️ 需重新上传</span>';
          }
        }
      } catch(e) {}
    }
  }

  function bindDragEvents() {
    const items = $('adminVideoList').querySelectorAll('.admin-video-item');
    let draggedItem = null;
    items.forEach(item => {
      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        item.style.opacity = '0.4';
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.style.opacity = '1';
        draggedItem = null;
        $('adminVideoList').querySelectorAll('.admin-video-item').forEach((el, idx) => {
          const vid = el.dataset.videoId;
          const video = meta.videos.find(v => v.id === vid);
          if (video) video.order = idx;
        });
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (draggedItem && draggedItem !== item) {
          const rect = item.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          if (e.clientY < midY) item.parentNode.insertBefore(draggedItem, item);
          else item.parentNode.insertBefore(draggedItem, item.nextSibling);
        }
      });
      item.addEventListener('drop', (e) => { e.preventDefault(); });
    });
  }

  // ================================================================
  //  ADMIN CRUD
  // ================================================================
  async function deleteVideo(vid) {
    const video = meta.videos.find(v => v.id === vid);
    if (!video) return;
    if (!confirm('确定要删除「' + video.title + '」吗？\n删除后无法恢复。')) return;
    if (video.type === 'local' && video.localId) { try { await idbDelete(video.localId); } catch(e) {} }
    meta.videos = meta.videos.filter(v => v.id !== vid);
    try {
      showSyncStatus('syncing');
      await deleteVideoFromSupabase(vid);
      showSyncStatus('已同步');
    } catch(e) { showToast('⚠️ 云端同步失败，请检查网络'); }
    renderAdminList(meta.videos);
    showToast('✅ 已删除');
  }

  $('addLinkBtn').addEventListener('click', async () => {
    const title = $('linkTitle').value.trim();
    const url = $('linkUrl').value.trim();
    if (!title) { showToast('请填写视频名称'); return; }
    if (!url) { showToast('请填写视频地址'); return; }
    try { new URL(url); } catch(e) { showToast('请输入有效的网址'); return; }

    const video = { id: generateId(), title, type: 'link', source: url, order: meta.videos.length };
    meta.videos.push(video);
    try {
      showSyncStatus('syncing');
      await saveVideoToSupabase(video);
      showSyncStatus('已同步');
    } catch(e) { showToast('⚠️ 云端同步失败，视频仅在本地保存'); }
    $('linkTitle').value = '';
    $('linkUrl').value = '';
    renderAdminList(meta.videos);
    showToast('✅ 视频链接已添加！');
  });

  $('uploadBtn').addEventListener('click', () => { $('fileInput').click(); });

  $('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const title = $('uploadTitle').value.trim() || file.name.replace(/\.[^.]+$/, '');
    const progWrap = $('progressWrapper');
    const progFill = $('progressFill');

    progWrap.style.display = 'block';
    progFill.style.width = '0%';

    try {
      progFill.style.width = '30%';
      await sleep(200);
      const blob = new Blob([file], { type: file.type });
      progFill.style.width = '70%';
      const localId = generateId();
      await idbPut(localId, blob);
      progFill.style.width = '100%';

      const video = { id: generateId(), title, type: 'local', localId, fileName: file.name, fileSize: file.size, order: meta.videos.length };
      meta.videos.push(video);

      try {
        showSyncStatus('syncing');
        await saveVideoToSupabase(video);
        showSyncStatus('已同步');
      } catch(err) { showToast('⚠️ 视频元数据同步失败，仅本地保存'); }

      await sleep(300);
      progWrap.style.display = 'none';
      progFill.style.width = '0%';
      $('uploadTitle').value = '';
      $('fileInput').value = '';
      renderAdminList(meta.videos);
      showToast('✅ 视频上传成功！');
    } catch(err) {
      progWrap.style.display = 'none';
      progFill.style.width = '0%';
      showToast('❌ 上传失败，请重试');
    }
  });

  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  function generateId() { return 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

  $('adminDoneBtn').addEventListener('click', async () => {
    try {
      showSyncStatus('syncing');
      await saveAllVideosToSupabase(meta.videos);
      showSyncStatus('已同步');
    } catch(e) { showToast('⚠️ 同步失败，请检查网络'); }
    switchToElderly();
    showToast('✅ 已保存！');
  });

  $('adminLogoutBtn').addEventListener('click', doLogout);

  // ================================================================
  //  LOGIN EVENT HANDLERS
  // ================================================================
  $('loginBtn').addEventListener('click', doLogin);
  $('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('loginEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginPassword').focus(); });

  $('showSignupLink').addEventListener('click', () => {
    signupMode = !signupMode;
    const link = $('showSignupLink');
    const btn = $('loginBtn');
    if (signupMode) { link.textContent = '已有账号？返回登录'; btn.textContent = '✨ 创建账号'; }
    else { link.textContent = '首次使用？创建账号'; btn.textContent = '🔐 登录'; }
    $('loginError').textContent = '';
    $('loginEmail').focus();
  });

  $('skipLoginLink').addEventListener('click', () => {
    currentUser = null;
    meta.videos = [];
    switchToElderly();
    showToast('⚠️ 离线模式，视频不会同步');
  });

  // ================================================================
  //  ADMIN ENTRY: 5-click on elderly title
  // ================================================================
  $('elderlyTitle').addEventListener('click', () => {
    titleClickCount++;
    if (titleClickCount === 1) { titleClickTimer = setTimeout(() => { titleClickCount = 0; }, TITLE_CLICK_WINDOW); }
    if (titleClickCount >= TITLE_CLICK_THRESHOLD) {
      titleClickCount = 0;
      if (titleClickTimer) clearTimeout(titleClickTimer);
      if (!currentUser) { showToast('请先登录再管理视频'); }
      else { switchToAdmin(); }
    }
  });

  // ================================================================
  //  PLAYER EVENTS
  // ================================================================
  $('playerBackBtn').addEventListener('click', closePlayer);
  $('playerPlayPauseBtn').addEventListener('click', togglePlayPause);

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('playerContainer').classList.contains('active')) { closePlayer(); }
    if (e.key === ' ' && $('playerContainer').classList.contains('active')) { e.preventDefault(); togglePlayPause(); }
  });

  // Cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (playerVideoEl && playerVideoEl.src.startsWith('blob:')) URL.revokeObjectURL(playerVideoEl.src);
  });

  // Pause when tab hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playerVideoEl && isPlaying) playerVideoEl.pause();
  });

  // ================================================================
  //  INIT — check existing session & boot
  // ================================================================
  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session && session.user) {
      currentUser = session.user;
      $('loginView').classList.remove('active');
      $('skipLoginLink').style.display = 'none';
      try { meta.videos = await loadVideosFromSupabase(); }
      catch(e) { console.warn('Failed to load videos:', e); meta.videos = []; }
      subscribeToChanges();
      switchToElderly();
    } else {
      $('loginView').classList.add('active');
      $('skipLoginLink').style.display = 'inline-block';
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        currentUser = null; meta.videos = []; unsubscribeFromChanges();
        if (currentMode !== 'login') switchToLogin();
      } else if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        loadVideosFromSupabase().then(v => { meta.videos = v; renderElderlyList(v); }).catch(() => {});
        subscribeToChanges();
      }
    });
  }

  init();
  console.log('👵💃 外婆健身操 v2 已启动！');
  console.log('  ✨ 设计升级：手绘蜡笔风 + 龙藏体 + 纸张纹理');
  console.log('  🔐 登录：Supabase Auth');
  console.log('  ☁️ 同步：实时数据库同步');
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>💃 外婆健身操</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --warm-orange: #e07b3c;
  --warm-orange-light: #f5a76b;
  --warm-orange-dark: #c45d20;
  --bg: #fff8f0;
  --bg-card: #ffffff;
  --text: #3d2c1e;
  --text-secondary: #8b6f5c;
  --text-muted: #b8a090;
  --shadow: 0 4px 20px rgba(61, 44, 30, 0.08);
  --shadow-hover: 0 6px 28px rgba(61, 44, 30, 0.14);
  --radius: 20px;
  --radius-sm: 12px;
  --danger: #d15252;
  --success: #5a9e6f;
  --font-xl: clamp(2rem, 5vw, 2.8rem);
  --font-lg: clamp(1.3rem, 3.5vw, 1.8rem);
  --font-md: clamp(1rem, 2.5vw, 1.2rem);
  --font-sm: clamp(0.85rem, 2vw, 0.95rem);
}

/* ===== Reset ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

/* ===== App Container ===== */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 800px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* ===== View Switching ===== */
.view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.view.active {
  opacity: 1;
  pointer-events: auto;
}

/* ===== Login View ===== */
.login-view {
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  background: var(--bg);
  gap: 20px;
}
.login-view .login-icon {
  font-size: 72px;
  animation: bounce 2s ease infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.login-view h1 {
  font-size: var(--font-xl);
  color: var(--warm-orange);
  letter-spacing: 2px;
  text-align: center;
}
.login-view .login-subtitle {
  font-size: var(--font-sm);
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 8px;
}
.login-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 32px 24px;
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.login-card label {
  font-size: var(--font-sm);
  font-weight: 600;
  color: var(--text-secondary);
}
.login-card .form-input {
  width: 100%;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  border: 2px solid #e8dbce;
  font-size: var(--font-md);
  font-family: inherit;
  background: #fff;
  color: var(--text);
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.login-card .form-input:focus {
  outline: none;
  border-color: var(--warm-orange);
}
.login-error {
  color: var(--danger);
  font-size: var(--font-sm);
  text-align: center;
  min-height: 20px;
}
.login-card .btn-login {
  padding: 18px;
  border-radius: 50px;
  border: none;
  font-size: var(--font-lg);
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  background: var(--warm-orange);
  color: #fff;
  transition: transform 0.1s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.login-card .btn-login:active { transform: scale(0.96); }
.login-card .btn-login:disabled {
  opacity: 0.6;
  pointer-events: none;
}
.login-footer {
  text-align: center;
}
.login-footer a {
  font-size: var(--font-sm);
  color: var(--warm-orange);
  text-decoration: none;
  cursor: pointer;
}
.login-footer a:hover { text-decoration: underline; }
.login-footer .logout-link {
  color: var(--text-muted);
  font-size: var(--font-sm);
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
}

/* ===== Elderly Mode ===== */
.elderly-header {
  padding: 24px 20px 12px;
  text-align: center;
  flex-shrink: 0;
}
.elderly-header h1 {
  font-size: var(--font-xl);
  font-weight: 700;
  color: var(--warm-orange);
  letter-spacing: 2px;
  cursor: default;
  display: inline-block;
}
.elderly-subtitle {
  font-size: var(--font-sm);
  color: var(--text-muted);
  margin-top: 4px;
}
.video-list-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 20px 100px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: var(--font-md); line-height: 1.6; }

/* Video card */
.video-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px 28px;
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 90px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.video-card:active { transform: scale(0.97); box-shadow: var(--shadow-hover); }
.video-card .card-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--warm-orange-light), var(--warm-orange));
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0; color: #fff;
}
.video-card .card-info { flex: 1; min-width: 0; }
.video-card .card-title {
  font-size: var(--font-lg); font-weight: 600;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.video-card .card-duration {
  font-size: var(--font-sm); color: var(--text-secondary); margin-top: 4px;
}
.video-card .card-arrow { font-size: 24px; color: var(--text-muted); flex-shrink: 0; }

/* Syncing indicator */
.sync-indicator {
  position: fixed;
  top: 8px;
  right: 16px;
  font-size: 0.75rem;
  color: var(--text-muted);
  z-index: 5;
  padding: 4px 10px;
  background: rgba(255,255,255,0.8);
  border-radius: 20px;
  transition: opacity 0.3s;
}
.sync-indicator.syncing { color: var(--warm-orange); }
.sync-indicator.synced { color: var(--success); opacity: 0; transition: opacity 0.5s 1s; }

/* ===== Player View ===== */
.player-container {
  position: absolute; inset: 0; background: #000;
  display: flex; flex-direction: column; z-index: 10;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.player-container.active { opacity: 1; pointer-events: auto; }
.player-top {
  display: flex; align-items: center; padding: 16px 20px; gap: 16px; flex-shrink: 0;
}
.player-back-btn {
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  font-size: var(--font-lg); padding: 12px 24px; border-radius: 50px;
  cursor: pointer; font-family: inherit; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.2s;
}
.player-back-btn:active { background: rgba(255,255,255,0.25); }
.player-video-wrapper {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #000; position: relative;
}
.player-video-wrapper video,
.player-video-wrapper iframe {
  width: 100%; height: 100%; border: none; object-fit: contain;
}
.player-video-wrapper .unsupported-hint {
  color: #fff; font-size: var(--font-md); text-align: center; padding: 20px;
}
.player-video-wrapper .unsupported-hint a {
  color: var(--warm-orange-light); font-size: var(--font-lg);
  display: inline-block; margin-top: 12px; padding: 16px 32px;
  background: rgba(255,255,255,0.1); border-radius: 50px; text-decoration: none;
}
.player-controls {
  display: flex; justify-content: center; padding: 20px; gap: 20px; flex-shrink: 0;
}
.player-ctrl-btn {
  width: 80px; height: 80px; border-radius: 50%; border: none;
  font-size: 36px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: transform 0.1s, background 0.2s;
  font-family: inherit;
}
.player-ctrl-btn:active { transform: scale(0.9); }
.player-ctrl-btn.play-pause {
  background: var(--warm-orange); color: #fff; width: 90px; height: 90px;
  font-size: 40px; box-shadow: 0 4px 20px rgba(224, 123, 60, 0.4);
}

/* ===== Admin Mode ===== */
.admin-container { padding: 16px 20px 100px; flex: 1; overflow-y: auto; }
.admin-container h2 {
  font-size: var(--font-lg); color: var(--text); margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.admin-section { margin-bottom: 24px; }
.admin-section h3 {
  font-size: var(--font-md); color: var(--text-secondary); margin-bottom: 10px; font-weight: 600;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 14px 24px; border-radius: 50px; border: none;
  font-size: var(--font-md); font-family: inherit; font-weight: 600;
  cursor: pointer; transition: transform 0.1s, background 0.2s;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--warm-orange); color: #fff; }
.btn-secondary { background: #f0e6db; color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-block { width: 100%; justify-content: center; }
.btn-sm { padding: 8px 16px; font-size: var(--font-sm); }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: var(--font-sm); font-weight: 600;
  color: var(--text-secondary); margin-bottom: 6px;
}
.form-input {
  width: 100%; padding: 14px 18px; border-radius: var(--radius-sm);
  border: 2px solid #e8dbce; font-size: var(--font-md);
  font-family: inherit; background: #fff; color: var(--text);
  transition: border-color 0.2s; -webkit-appearance: none;
}
.form-input:focus { outline: none; border-color: var(--warm-orange); }

/* Video item in admin list */
.admin-video-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: #fff; border-radius: var(--radius-sm); margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.admin-video-item .drag-handle { cursor: grab; color: var(--text-muted); font-size: 20px; padding: 4px; }
.admin-video-item .item-info { flex: 1; min-width: 0; }
.admin-video-item .item-title {
  font-size: var(--font-md); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.admin-video-item .item-type { font-size: var(--font-sm); color: var(--text-muted); }
.admin-video-item .item-delete {
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: var(--danger); padding: 8px; border-radius: 8px; transition: background 0.2s;
}
.admin-video-item .item-delete:active { background: rgba(209, 82, 82, 0.1); }

.admin-bottom {
  position: sticky; bottom: 0; background: var(--bg); padding: 16px 20px;
  border-top: 1px solid #e8dbce; display: flex; gap: 12px; flex-shrink: 0;
}

/* User info bar in admin */
.admin-user-bar {
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--font-sm); color: var(--text-muted);
  padding: 8px 0; margin-bottom: 16px;
  border-bottom: 1px solid #f0e6db;
}
.admin-user-bar .logout-btn {
  background: none; border: 1px solid var(--text-muted);
  color: var(--text-muted); font-size: 0.75rem; padding: 4px 12px;
  border-radius: 20px; cursor: pointer; font-family: inherit;
}

/* ===== Toast ===== */
.toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-120px);
  background: #3d2c1e; color: #fff; padding: 14px 28px;
  border-radius: 50px; font-size: var(--font-md); font-weight: 600;
  z-index: 200; pointer-events: none;
  transition: transform 0.3s ease; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== Upload progress ===== */
.progress-bar-wrapper {
  margin-top: 12px; background: #e8dbce; border-radius: 10px;
  height: 8px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--warm-orange); border-radius: 10px;
  width: 0%; transition: width 0.3s ease;
}

/* ===== Responsive ===== */
@media (max-width: 400px) {
  .video-card { padding: 20px; gap: 14px; min-height: 76px; }
  .video-card .card-icon { width: 44px; height: 44px; font-size: 22px; border-radius: 12px; }
  .player-ctrl-btn { width: 64px; height: 64px; font-size: 28px; }
  .player-ctrl-btn.play-pause { width: 72px; height: 72px; font-size: 32px; }
}
@media (min-width: 768px) {
  .video-list-scroll { padding: 12px 32px 100px; }
  .video-card { min-height: 100px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===== Login View ===== -->
  <div class="view active" id="loginView">
    <div class="login-view" style="flex:1;display:flex">
      <div class="login-icon">💃</div>
      <h1>外婆健身操</h1>
      <p class="login-subtitle">登录后可同步视频列表</p>

      <div class="login-card">
        <div>
          <label for="loginEmail">📧 邮箱</label>
          <input class="form-input" type="email" id="loginEmail"
                 placeholder="输入邮箱地址" autocomplete="email" inputmode="email">
        </div>
        <div>
          <label for="loginPassword">🔒 密码</label>
          <input class="form-input" type="password" id="loginPassword"
                 placeholder="输入密码" autocomplete="current-password">
        </div>
        <p class="login-error" id="loginError"></p>
        <button class="btn-login" id="loginBtn">🔐 登录</button>
      </div>

      <div class="login-footer">
        <a id="showSignupLink">首次使用？创建账号</a>
        <br>
        <span class="logout-link" id="skipLoginLink" style="display:none">跳过登录，本地使用</span>
      </div>
    </div>
  </div>

  <!-- ===== Elderly Mode ===== -->
  <div class="view" id="elderlyView">
    <div class="elderly-header">
      <h1 id="elderlyTitle">💃 外婆健身操</h1>
      <p class="elderly-subtitle" id="videoCountHint"></p>
    </div>

    <div class="video-list-scroll" id="videoList"></div>

    <div class="sync-indicator" id="syncIndicator" style="display:none"></div>

    <!-- Player overlay -->
    <div class="player-container" id="playerContainer">
      <div class="player-top">
        <button class="player-back-btn" id="playerBackBtn">◀ 返回列表</button>
      </div>
      <div class="player-video-wrapper" id="playerVideoWrapper"></div>
      <div class="player-controls">
        <button class="player-ctrl-btn play-pause" id="playerPlayPauseBtn" title="暂停 / 播放">⏸️</button>
      </div>
    </div>
  </div>

  <!-- ===== Admin Mode ===== -->
  <div class="view" id="adminView">
    <div class="admin-container">
      <h2>⚙️ 视频管理</h2>

      <div class="admin-user-bar">
        <span id="adminUserEmail"></span>
        <button class="logout-btn" id="adminLogoutBtn">退出登录</button>
      </div>

      <!-- Add link -->
      <div class="admin-section">
        <h3>🔗 添加视频链接</h3>
        <div class="form-group">
          <label for="linkTitle">视频名称</label>
          <input class="form-input" type="text" id="linkTitle" placeholder="例如：八段锦完整版">
        </div>
        <div class="form-group">
          <label for="linkUrl">视频地址</label>
          <input class="form-input" type="url" id="linkUrl" placeholder="https://...  B站 / YouTube / 直链">
        </div>
        <button class="btn btn-primary btn-block" id="addLinkBtn">➕ 添加链接视频</button>
      </div>

      <!-- Upload local -->
      <div class="admin-section">
        <h3>📁 上传本地视频</h3>
        <button class="btn btn-secondary btn-block" id="uploadBtn">📂 选择视频文件上传</button>
        <input type="file" id="fileInput" accept="video/*" style="display:none">
        <div class="form-group" style="margin-top:12px">
          <label for="uploadTitle">视频名称（可选）</label>
          <input class="form-input" type="text" id="uploadTitle" placeholder="不填则使用文件名">
        </div>
        <div class="progress-bar-wrapper" id="progressWrapper" style="display:none">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Video management list -->
      <div class="admin-section">
        <h3>📋 视频列表（长按拖拽排序）</h3>
        <div id="adminVideoList"></div>
        <p style="color:var(--text-muted);font-size:0.8rem;text-align:center" id="emptyAdminHint">暂无视频，请添加上方添加</p>
      </div>
    </div>

    <div class="admin-bottom">
      <button class="btn btn-secondary" id="adminDoneBtn" style="flex:1">✅ 完成</button>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

</div>

<script>
(function() {
  'use strict';

  // ============================
  //  Supabase Init
  // ============================
  const SUPABASE_URL = 'https://mbkdigtofgmdkepwsrve.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ia2RpZ3RvZmdtZGtlcHdzcnZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTMyMjcsImV4cCI6MjA5NzI2OTIyN30.BGlRJJbL6BvcZC1XrZTeN_3AOiiQgiAKniXfREunzeQ';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ============================
  //  IndexedDB Adapter
  // ============================
  const IDB_NAME = 'GrandmaFitnessDB';
  const IDB_VERSION = 1;
  const IDB_STORE = 'videos';

  function openIDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbPut(id, blob) {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({ id, blob });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function idbGet(id) {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(id);
      req.onsuccess = () => resolve(req.result ? req.result.blob : null);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbDelete(id) {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ============================
  //  Supabase Video Operations
  // ============================
  async function loadVideosFromSupabase() {
    const { data, error } = await supabase
      .from('videos')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('sort_order', { ascending: true });

    if (error) throw error;
    return (data || []).map(r => ({
      id: r.id,
      title: r.title,
      type: r.type,
      source: r.source || null,
      localId: r.local_id || null,
      fileName: r.file_name || null,
      fileSize: r.file_size || null,
      order: r.sort_order || 0
    }));
  }

  async function saveVideoToSupabase(video) {
    const { error } = await supabase.from('videos').upsert({
      id: video.id,
      title: video.title,
      type: video.type,
      source: video.source || null,
      local_id: video.localId || null,
      file_name: video.fileName || null,
      file_size: video.fileSize || null,
      sort_order: video.order,
      user_id: currentUser.id,
      updated_at: new Date().toISOString()
    });
    if (error) throw error;
  }

  async function deleteVideoFromSupabase(videoId) {
    const { error } = await supabase.from('videos').delete().eq('id', videoId).eq('user_id', currentUser.id);
    if (error) throw error;
  }

  async function saveAllVideosToSupabase(videos) {
    const rows = videos.map(v => ({
      id: v.id,
      title: v.title,
      type: v.type,
      source: v.source || null,
      local_id: v.localId || null,
      file_name: v.fileName || null,
      file_size: v.fileSize || null,
      sort_order: v.order,
      user_id: currentUser.id,
      updated_at: new Date().toISOString()
    }));

    // Delete all existing, then insert all (atomic-ish via upsert)
    const { error } = await supabase.from('videos').upsert(rows);
    if (error) throw error;
  }

  // ============================
  //  Realtime Subscription
  // ============================
  let realtimeChannel = null;

  function subscribeToChanges() {
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
    }

    realtimeChannel = supabase
      .channel('videos-changes')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'videos', filter: `user_id=eq.${currentUser.id}` },
        async () => {
          // Reload videos from Supabase when any change happens
          try {
            const videos = await loadVideosFromSupabase();
            if (currentMode === 'elderly') {
              renderElderlyList(videos);
            } else if (currentMode === 'admin') {
              renderAdminList(videos);
            }
            showSyncIndicator('已同步');
          } catch(e) {
            showSyncIndicator('同步失败');
          }
        }
      )
      .subscribe();
  }

  function unsubscribeFromChanges() {
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
  }

  function showSyncIndicator(status) {
    const el = $('#syncIndicator');
    if (!el) return;

      el.textContent = '☁️ 同步中...';

      el.textContent = '✅ 已同步';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
  }

  async function doLogin() {
    const email = loginEmail.value.trim();
    const password = loginPassword.value.trim();

    if (!email) { loginError.textContent = '请输入邮箱地址'; return; }
    if (!password) { loginError.textContent = '请输入密码'; return; }
    if (password.length < 6) { loginError.textContent = '密码至少6位'; return; }

    loginBtn.disabled = true;
    loginError.textContent = '';

    try {
      if (signupMode) {
        // Sign up
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: window.location.href }
        });
        if (error) throw error;
        if (data.user) {
          showToast('✅ 账号创建成功！');
          signupMode = false;
          // Auto-login after signup (user might need email confirmation if enabled)
          loginError.textContent = '';
          showSignupLink.textContent = '首次使用？创建账号';
        }
      }

      // Sign in
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;

      currentUser = data.user;
      onLoginSuccess();
    } catch(err) {
      loginError.textContent = getAuthErrorMessage(err);
    } finally {
      loginBtn.disabled = false;
    }
  }

  function getAuthErrorMessage(err) {
    const msg = err.message || String(err);
    if (msg.includes('Invalid login credentials') || msg.includes('Invalid Login'))
      return '邮箱或密码错误，请重试';
    if (msg.includes('Email not confirmed'))
      return '邮箱尚未验证，请先确认邮箱';
    if (msg.includes('User already registered') || msg.includes('already been registered'))
      return '该邮箱已注册，请直接登录';
    if (msg.includes('password') && msg.includes('weak'))
      return '密码太弱，请使用6位以上密码';
    if (msg.includes('valid email'))
      return '请输入有效的邮箱地址';
    if (msg.includes('rate') || msg.includes('limit'))
      return '请求太频繁，请稍后再试';
    if (msg.includes('network') || msg.includes('fetch'))
      return '网络连接失败，请检查网络';
    return `登录失败：${msg}`;
  }

  // ============================

  async function openPlayer(video) {
    currentPlayingVideo = video;
    playerVideoWrapper.innerHTML = '';
    playerVideoEl = null;
    isPlaying = false;
    playerPlayPauseBtn.textContent = '▶️';
    playerContainer.classList.add('active');

    if (video.type === 'local') {
      try {
        showToast('正在加载视频...', 1500);
        const blob = await idbGet(video.localId);
        if (!blob) {
          playerVideoWrapper.innerHTML = `<div class="unsupported-hint">视频文件找不到了 😢<br><small>请让家人重新添加</small></div>`;
          return;
        }
        const url = URL.createObjectURL(blob);
        createVideoElement(url);
      } catch(e) {
        playerVideoWrapper.innerHTML = `<div class="unsupported-hint">视频加载失败 😢</div>`;
      }
    } else if (video.type === 'link') {
      const src = video.source;
      if (isBilibiliUrl(src)) {
        const bvid = extractBvid(src);
        if (bvid) {
          playerVideoWrapper.innerHTML = `
            <iframe src="https://player.bilibili.com/player.html?bvid=${bvid}&high_quality=1&autoplay=1"
              allowfullscreen allow="autoplay; fullscreen"
              sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>`;
          isPlaying = true;
          playerPlayPauseBtn.textContent = '⏸️';
        } else {
          showExternalLinkView(src);
          playerPlayPauseBtn.textContent = '👆';
        }
      } else if (isYouTubeUrl(src)) {
        const videoId = extractYouTubeId(src);
        if (videoId) {
          playerVideoWrapper.innerHTML = `
            <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1"
              allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
          isPlaying = true;
          playerPlayPauseBtn.textContent = '⏸️';
        } else {
          showExternalLinkView(src);
          playerPlayPauseBtn.textContent = '👆';
        }
      } else if (isDirectVideoUrl(src)) {
        createVideoElement(src);
      } else {
        showExternalLinkView(src);
        playerPlayPauseBtn.textContent = '👆';
      }
    }
  }

  function createVideoElement(src) {
    playerVideoWrapper.innerHTML = '';
    const video = document.createElement('video');
    video.src = src;
    video.controls = false;
    video.playsInline = true;
    video.style.cssText = 'width:100%;height:100%;object-fit:contain;';
    video.setAttribute('playsinline', '');
    video.play().then(() => {
      isPlaying = true;
      playerPlayPauseBtn.textContent = '⏸️';
    }).catch(() => {
      isPlaying = false;
      playerPlayPauseBtn.textContent = '▶️';
    });
    video.addEventListener('ended', () => {
      isPlaying = false;
      playerPlayPauseBtn.textContent = '🔄';
    });
    video.addEventListener('play', () => {
      isPlaying = true;
      playerPlayPauseBtn.textContent = '⏸️';
    });
    video.addEventListener('pause', () => {
      isPlaying = false;
      playerPlayPauseBtn.textContent = '▶️';
    });
    playerVideoWrapper.appendChild(video);
    playerVideoEl = video;
  }

  // ============================
  //  URL Detection Helpers
  // ============================
  function isBilibiliUrl(url) { return /bilibili\.com/i.test(url); }
  function extractBvid(url) { const m = url.match(/BV[a-zA-Z0-9]+/); return m ? m[0] : null; }
  function isYouTubeUrl(url) { return /(youtube\.com|youtu\.be)/i.test(url); }
  function extractYouTubeId(url) {
    const patterns = [
      /[?&]v=([a-zA-Z0-9_-]{11})/,
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /\/embed\/([a-zA-Z0-9_-]{11})/,
      /\/v\/([a-zA-Z0-9_-]{11})/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }
  function isDirectVideoUrl(url) {
    try {
      const pathname = new URL(url).pathname.toLowerCase();
      return /\.(mp4|m3u8|webm|ogg|mov|mkv|avi|ts|flv)(\?|#|$)/.test(pathname)
          || /\.(mp4|m3u8|webm|ogg|mov|mkv|avi|ts|flv)$/.test(pathname);
    } catch(e) { return false; }
  }
  function isSocialPlatformUrl(url) {
    const platforms = [
      /channels\.weixin\.qq\.com/i, /finder\.video\.qq\.com/i, /weixin\.qq\.com/i,
      /douyin\.com/i, /kuaishou\.com/i, /xiaohongshu\.com/i, /xhslink\.com/i,
      /weibo\.com/i, /weibo\.cn/i, /zhihu\.com/i, /ixigua\.com/i,
      /haokan\.baidu\.com/i, /v\.qq\.com/i, /iqiyi\.com/i, /youku\.com/i, /mgtv\.com/i,
    ];
    return platforms.some(p => p.test(url));
  }
  function isWeChatVideoUrl(url) {
    return /channels\.weixin\.qq\.com|finder\.video\.qq\.com|weixin\.qq\.com/i.test(url);
  }
  function getPlatformName(url) {
    if (isWeChatVideoUrl(url)) return '微信视频号';
    if (/douyin\.com/i.test(url)) return '抖音';
    if (/kuaishou\.com/i.test(url)) return '快手';
    if (/xiaohongshu\.com|xhslink\.com/i.test(url)) return '小红书';
    if (/weibo\.com|weibo\.cn/i.test(url)) return '微博';
    if (/zhihu\.com/i.test(url)) return '知乎';
    if (/ixigua\.com/i.test(url)) return '西瓜视频';
    if (/haokan\.baidu\.com/i.test(url)) return '好看视频';
    if (/v\.qq\.com/i.test(url)) return '腾讯视频';
    if (/iqiyi\.com/i.test(url)) return '爱奇艺';
    if (/youku\.com/i.test(url)) return '优酷';
    if (/mgtv\.com/i.test(url)) return '芒果TV';
    return '该平台';
  }
  function getVideoTypeLabel(v) {
    if (v.type === 'local') return '本地视频';
    if (isBilibiliUrl(v.source)) return 'B站视频';
    if (isYouTubeUrl(v.source)) return 'YouTube';
    if (isDirectVideoUrl(v.source)) return '在线视频';
    return `${getPlatformName(v.source)}视频`;
  }

  async function checkMissingLocalBlobs() {
    const localVideos = meta.videos.filter(v => v.type === 'local' && v.localId);
    for (const v of localVideos) {
      try {
        const blob = await idbGet(v.localId);
        if (!blob) {
          const item = adminVideoList.querySelector(`[data-video-id="${v.id}"]`);
          if (item) {
            const warning = item.querySelector('.item-blob-warning');
            if (warning) warning.style.display = 'inline';
          }
        }
      } catch(e) {}
    }
  }

  function bindDragEvents() {
    const items = adminVideoList.querySelectorAll('.admin-video-item');
    let draggedItem = null;
    items.forEach(item => {
      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        item.style.opacity = '0.5';
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', (e) => {
        item.style.opacity = '1';
        draggedItem = null;
        const currentItems = adminVideoList.querySelectorAll('.admin-video-item');
        currentItems.forEach((el, idx) => {
          const vid = el.dataset.videoId;
          const video = meta.videos.find(v => v.id === vid);
          if (video) video.order = idx;
        });
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (draggedItem && draggedItem !== item) {
          const rect = item.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          if (e.clientY < midY) {
            item.parentNode.insertBefore(draggedItem, item);
          } else {
            item.parentNode.insertBefore(draggedItem, item.nextSibling);
          }
        }
      });
      item.addEventListener('drop', (e) => { e.preventDefault(); });
    });
  }

  async function deleteVideo(vid) {
    const video = meta.videos.find(v => v.id === vid);
    if (!video) return;
    if (!confirm(`确定要删除「${video.title}」吗？\n删除后无法恢复。`)) return;

    if (video.type === 'local' && video.localId) {
      try { await idbDelete(video.localId); } catch(e) {}
    }

    meta.videos = meta.videos.filter(v => v.id !== vid);

    // Sync to Supabase
    try {
      showSyncIndicator('syncing');
      await deleteVideoFromSupabase(vid);
      showSyncIndicator('已同步');
    } catch(e) {
      showToast('⚠️ 云端同步失败，请检查网络');
    }

    renderAdminList(meta.videos);
    showToast('✅ 已删除');
  }

  addLinkBtn.addEventListener('click', async () => {
    const title = linkTitleInput.value.trim();
    const url = linkUrlInput.value.trim();
    if (!title) { showToast('请填写视频名称'); return; }
    if (!url) { showToast('请填写视频地址'); return; }
    try { new URL(url); } catch(e) { showToast('请输入有效的网址'); return; }

    const video = {
      id: generateId(),
      title: title,
      type: 'link',
      source: url,
      order: meta.videos.length
    };

    meta.videos.push(video);

    try {
      showSyncIndicator('syncing');
      await saveVideoToSupabase(video);
      showSyncIndicator('已同步');
    } catch(e) {
      showToast('⚠️ 云端同步失败，视频仅在本地保存');
    }

    linkTitleInput.value = '';
    linkUrlInput.value = '';
    renderAdminList(meta.videos);
    showToast('✅ 视频链接已添加！');
  });

  uploadBtn.addEventListener('click', () => { fileInput.click(); });

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const title = uploadTitleInput.value.trim() || file.name.replace(/\.[^.]+$/, '');

    progressWrapper.style.display = 'block';
    progressFill.style.width = '0%';

    try {
      progressFill.style.width = '30%';
      await sleep(200);
      const blob = await readFileAsBlob(file);
      progressFill.style.width = '70%';
      const localId = generateId();
      await idbPut(localId, blob);
      progressFill.style.width = '100%';

      const video = {
        id: generateId(),
        title: title,
        type: 'local',
        localId: localId,
        fileName: file.name,
        fileSize: file.size,
        order: meta.videos.length
      };

      meta.videos.push(video);

      // Sync metadata to Supabase (blob stays local)
      try {
        showSyncIndicator('syncing');
        await saveVideoToSupabase(video);
        showSyncIndicator('已同步');
      } catch(err) {
        showToast('⚠️ 视频元数据同步失败，仅本地保存');
      }

      await sleep(300);
      progressWrapper.style.display = 'none';
      progressFill.style.width = '0%';
      uploadTitleInput.value = '';
      fileInput.value = '';
      renderAdminList(meta.videos);
      showToast('✅ 视频上传成功！');
    } catch(err) {
      progressWrapper.style.display = 'none';
      progressFill.style.width = '0%';
      showToast('❌ 上传失败，请重试');
    }
  });

  function readFileAsBlob(file) {
    return new Promise((resolve, reject) => {
      try { resolve(new Blob([file], { type: file.type })); }
      catch(e) { reject(e); }
    });
  }

  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  function generateId() {
    return 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  // Done button (was Save & Exit)
  adminDoneBtn.addEventListener('click', async () => {
    // Sync all videos order to Supabase
    try {
      showSyncIndicator('syncing');
      await saveAllVideosToSupabase(meta.videos);
      showSyncIndicator('已同步');
    } catch(e) {
      showToast('⚠️ 同步失败，请检查网络');
    }
    switchToElderly();
    showToast('✅ 已保存！');
  });

  adminLogoutBtn.addEventListener('click', doLogout);

  // ============================
  //  Login Event Handlers
  // ============================
  loginBtn.addEventListener('click', doLogin);

  loginPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
  loginEmail.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginPassword.focus();
  });

  showSignupLink.addEventListener('click', () => {
    signupMode = !signupMode;
    if (signupMode) {
      showSignupLink.textContent = '已有账号？返回登录';
      loginBtn.textContent = '✨ 创建账号';
      loginError.textContent = '';
    } else {
      showSignupLink.textContent = '首次使用？创建账号';
      loginBtn.textContent = '🔐 登录';
    }
    loginEmail.focus();
  });

  skipLoginLink.addEventListener('click', () => {
    currentUser = null;
    meta.videos = [];
    switchToElderly();
    showToast('⚠️ 离线模式，视频不会同步');
  });

  // ============================
  //  Admin Entry: 5-click on title
  // ============================
  elderlyTitle.addEventListener('click', () => {
    titleClickCount++;
    if (titleClickCount === 1) {
      titleClickTimer = setTimeout(() => { titleClickCount = 0; }, TITLE_CLICK_WINDOW);
    }
    if (titleClickCount >= TITLE_CLICK_THRESHOLD) {
      titleClickCount = 0;
      if (titleClickTimer) clearTimeout(titleClickTimer);
      if (!currentUser) {
        showToast('请先登录再管理视频');
      } else {
        switchToAdmin();
      }
    }
  });

  // ============================
  //  Player Events
  // ============================
  playerBackBtn.addEventListener('click', closePlayer);
  playerPlayPauseBtn.addEventListener('click', togglePlayPause);

  // ============================
  //  Keyboard Shortcuts
  // ============================
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && playerContainer.classList.contains('active')) {
      closePlayer();
    }
    if (e.key === ' ' && playerContainer.classList.contains('active')) {
      e.preventDefault();
      togglePlayPause();
    }
  });

  // ============================
  //  Cleanup
  // ============================
  window.addEventListener('beforeunload', () => {
    if (playerVideoEl && playerVideoEl.src.startsWith('blob:')) {
      URL.revokeObjectURL(playerVideoEl.src);
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playerVideoEl && isPlaying) {
      playerVideoEl.pause();
    }
  });

  // ============================
  //  Init
  // ============================
  async function init() {
    // Check for existing session
    const { data: { session } } = await supabase.auth.getSession();

    if (session && session.user) {
      currentUser = session.user;
      loginView.classList.remove('active');
      skipLoginLink.style.display = 'none';

      try {
        meta.videos = await loadVideosFromSupabase();
      } catch(e) {
        console.warn('Failed to load videos:', e);
        meta.videos = [];
      }

      subscribeToChanges();
      switchToElderly();
    } else {
      // Show login view
      loginView.classList.add('active');
      skipLoginLink.style.display = 'inline-block';
    }

    // Listen for auth state changes
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        currentUser = null;
        meta.videos = [];
        unsubscribeFromChanges();
        if (currentMode !== 'login') switchToLogin();
      } else if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        // Reload videos
        loadVideosFromSupabase().then(v => {
          meta.videos = v;
          renderElderlyList(v);
        }).catch(() => {});
        subscribeToChanges();
      }
    });
  }

  init();

  console.log('👵💃 外婆健身操已就绪！');
  console.log('  登录：Supabase Auth (邮箱+密码)');
  console.log('  同步：实时数据库同步');
  console.log('  存储：Supabase + IndexedDB (本地视频)');
})();
</script>
</body>
</html>
